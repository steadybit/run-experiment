name: 'test'
on:
    push:
        branches:
            - main
    pull_request:
      branches: [ main ]

jobs:
    unit-test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
            - run: npm install -g npm@12
            - run: npm ci
            - run: npm run lint
            - run: npm test
            - run: npm run prepare
            - name: verify dist/ is up to date
              run: git diff --exit-code --stat dist/
            - name: '[main] set up snyk'
              if: github.ref == 'refs/heads/main'
              uses: steadybit/extension-kit/.github/actions/setup-snyk@main # NOSONAR githubactions:S7637 - our own action
            - name: '[main] snyk monitor'
              if: github.ref == 'refs/heads/main'
              env:
                  SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
              run: snyk monitor --prune-repeated-subdependencies --target-reference="$GITHUB_REF_NAME"
